services:
  db:
    image: mysql:8.0
    container_name: anomaly-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: anomaly
      MYSQL_USER: anomaly_user
      MYSQL_PASSWORD: anomaly_pass
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  db_data: